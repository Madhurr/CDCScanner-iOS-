name: CardCheckout
options:
  deploymentTarget:
    iOS: "16.0"
packages:
  CDCScanner:
    path: ../..
targets:
  CardCheckout:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: CDCScanner
        product: CDCSecureFields
      - package: CDCScanner
        product: CDCScanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.cdcscanner.example.checkout
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the number and expiry on a test card.
        TARGETED_DEVICE_FAMILY: "1,2"
  CardCheckoutUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.cdcscanner.example.checkout.uitests
    dependencies:
      - target: CardCheckout
schemes:
  CardCheckout:
    build:
      targets:
        CardCheckout: all
    test:
      targets:
        - CardCheckoutUITests
