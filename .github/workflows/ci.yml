name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build & test (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme CDCScanner \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO | tail -n 50

      - name: Run tests on iOS Simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme CDCScanner \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO | tail -n 100

  core:
    name: Core tests (macOS, strict concurrency)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test parsing core
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
